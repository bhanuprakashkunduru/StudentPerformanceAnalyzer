<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Student</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">Student Performance Analyzer</div>

      <div class="nav-links">
        <a href="/">Dashboard</a>

        <a href="/add-student">Add Student</a>

        <a href="/students" class="active"> Students </a>

        <a href="/analytics"> Analytics </a>

        <a href="/prediction"> Prediction </a>
      </div>
    </nav>

    <main class="container">
      <div class="form-container">
        <h1>Edit Student</h1>

        <form action="/update-student/{{ student.id }}" method="POST">
          <div class="form-group">
            <label>Student Name</label>

            <input
              type="text"
              name="name"
              value="{{ student.name }}"
              required
            />
          </div>

          <div class="form-group">
            <label>Attendance (%)</label>

            <input
              type="number"
              name="attendance"
              value="{{ student.attendance }}"
              min="0"
              max="100"
              step="0.01"
              required
            />
          </div>

          <div class="form-group">
            <label>Study Hours per Day</label>

            <input
              type="number"
              name="study_hours"
              value="{{ student.study_hours }}"
              min="0"
              max="24"
              step="0.1"
              required
            />
          </div>

          <div class="form-group">
            <label>Assignments Completed</label>

            <input
              type="number"
              name="assignments_completed"
              value="{{ student.assignments_completed }}"
              min="0"
              required
            />
          </div>

          <div class="form-group">
            <label>Total Assignments</label>

            <input
              type="number"
              name="assignments_total"
              value="{{ student.assignments_total }}"
              min="1"
              required
            />
          </div>

          <div class="form-group">
            <label>Internal Marks</label>

            <input
              type="number"
              name="internal_marks"
              value="{{ student.internal_marks }}"
              min="0"
              max="40"
              step="0.01"
              required
            />
          </div>

          <div class="form-group">
            <label>Previous Percentage</label>

            <input
              type="number"
              name="previous_percentage"
              value="{{ student.previous_percentage }}"
              min="0"
              max="100"
              step="0.01"
              required
            />
          </div>

          <div class="form-buttons">
            <a href="/students" class="cancel-btn"> Cancel </a>

            <button type="submit">Update Student</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
